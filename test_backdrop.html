<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backdrop Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .viewport {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      background: #f7f3ec url('assets/pin3_preview.jpg') no-repeat center top / cover;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.45) 0%, rgba(250, 246, 238, 0.2) 60%, rgba(240, 230, 215, 0.4) 100%);
      pointer-events: none;
    }
    .content-box {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 60px 24px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }
    .bismillah {
      font-size: 26px;
      font-weight: bold;
      color: #2b1f14;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #7b5924;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="overlay"></div>
    <div class="content-box">
      <div>
        <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="title">In the name of Allah, Most Gracious, Most Merciful</div>
      </div>
      <div>
        <h2 style="font-size: 28px; color: #1a1a1a;">Mahek & Aman</h2>
        <p style="color: #665; margin-top: 6px;">Sunday, 27 December 2026</p>
      </div>
      <div style="font-size: 14px; color: #887;">
        Govind Garden, Dighi, Pune
      </div>
    </div>
  </div>
</body>
</html>
